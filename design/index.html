<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 移动端适配：禁止缩放、全屏、安全区 -->
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>海岛日记</title>

<!-- ====== 样式表 ====== -->
<link rel="stylesheet" href="css/variables.css">    <!-- CSS变量、主题色 -->
<link rel="stylesheet" href="css/animations.css">   <!-- 关键帧动画 -->
<link rel="stylesheet" href="css/scene.css">        <!-- 场景三层、天空、云、森林 -->
<link rel="stylesheet" href="css/elements.css">     <!-- 房子、角色、树、河流、装饰物 -->
<link rel="stylesheet" href="css/farm.css">         <!-- 菜地网格、作物状态 -->
<link rel="stylesheet" href="css/ui.css">           <!-- 顶部栏、浮动菜单、面板、弹窗 -->

<style>
/* 全局重置：去边距、去点击高亮、禁止选中 */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:#1a1a1a;user-select:none;-webkit-user-select:none;touch-action:manipulation}
</style>
</head>
<body>

<!-- ====== 游戏主容器 ====== -->
<div id="game">

  <!-- ========== 场景三层系统 ========== -->
  <!-- 三层以不同速度随拖拽移动，营造空间纵深感 -->
  <div id="scene">

    <!-- 【远景层】背景图，拖拽时移动最慢 -->
    <div class="layer far">
      <!-- 场景背景图：替换为你自己的背景 -->
      <img src="assets/场景背景.png" class="scene-bg" alt="场景背景">
    </div>

    <!-- 【中景层】建筑和角色，拖拽时正常速度 -->
    <div class="layer mid">
      <!-- 房子：位置和大小在 elements.css 中调整 -->
      <div class="cottage">
        <img src="assets/房子.png" alt="房子">
      </div>

      <!-- 主角：点击空地可行走，点击角色可对话 -->
      <div class="character idle" id="playerChar">
        <img src="assets/角色1.png" alt="角色">
      </div>

      <!-- 樱花树装饰 -->
      <div class="cherry-tree">
        <img src="assets/Q_style_chibi_cute_cherry_blos_2026-07-25T05-13-01.png" alt="樱花树">
      </div>
    </div>

    <!-- 【近景层】菜地和装饰物，拖拽时移动最快 -->
    <div class="layer near">
      <!-- 小船（CSS绘制，点击可打开收购面板） -->
      <div class="boat" id="boatIcon">
        <div class="boat-flag"></div>
        <div class="boat-sail"></div>
        <div class="boat-hull"></div>
      </div>

      <!-- ====== 菜地系统 ====== -->
      <!-- 土地底图：9块地的图片，格子透明覆盖在上面 -->
      <img src="assets/土地.png" class="land-img" alt="土地"
           style="left:430px;top:440px;width:144px;height:144px;">
      <!-- 3x3 透明种植格子，JS动态生成 -->
      <div id="farmGrid"></div>

      <!-- ====== 待替换装饰物 ====== -->
      <!-- 鸭：<img src="assets/duck.png" class="decor-img" style="left:610px;top:370px;width:28px"> -->
      <!-- 南瓜：<img src="assets/pumpkin.png" class="decor-img" style="left:395px;top:680px;width:28px"> -->
      <!-- 陶罐：<img src="assets/pot.png" class="decor-img" style="left:670px;top:678px;width:26px"> -->
      <!-- 花丛：<img src="assets/flowers.png" class="decor-img" style="left:395px;top:415px;width:40px"> -->
    </div>
  </div>

  <!-- 昼夜循环覆盖层（半透明叠加，游戏时间变化时颜色渐变） -->
  <div id="dayNightOverlay"></div>

  <!-- ========== 顶部状态栏 ========== -->
  <div id="topbar">
    <!-- 左侧：头像 + 等级 + 经验条 -->
    <div class="player-info">
      <div class="avatar" id="avatar">👧</div>
      <div>
        <div class="level-badge" id="levelText">Lv.1</div>
        <div class="exp-bar"><div class="exp-fill" id="expFill" style="width:0%"></div></div>
      </div>
    </div>
    <!-- 中间：当前任务 -->
    <div class="quest-box" id="questBox">
      <span class="quest-icon">📋</span>
      <span id="questText">收获 0/3 🥬</span>
    </div>
    <!-- 右侧：星币数量 -->
    <div class="currency-box">
      <div class="coin-display"><span>🪙</span><span id="coinText">500</span></div>
    </div>
  </div>

  <!-- ========== 右下角浮动菜单 ========== -->
  <div id="fabMenu">
    <!-- 子按钮组：点击＋后展开 -->
    <div id="fabActions">
      <button class="fab-btn seeds" data-fn="seeds">
        🌱<span class="fab-tip">种子</span>
      </button>
      <button class="fab-btn inv" data-fn="inventory">
        📦<span class="fab-tip">仓库</span>
      </button>
      <button class="fab-btn boat" data-fn="boat">
        ⛵<span class="fab-tip">收购船</span>
      </button>
      <button class="fab-btn menu" data-fn="menu">
        ⚙️<span class="fab-tip">菜单</span>
      </button>
    </div>
    <!-- 主按钮：点击展开/收起子按钮 -->
    <button id="fabMain">＋</button>
  </div>

  <!-- ========== 弹窗系统 ========== -->
  <!-- 半透明遮罩 -->
  <div id="overlay"></div>
  <!-- 底部滑出面板（种子商店/仓库/收购船/菜单共用） -->
  <div class="panel" id="panel"></div>
  <!-- 菜地点击弹窗（选择种子/浇水/收获） -->
  <div id="plotAction"></div>
  <!-- 顶部浮动提示 -->
  <div id="toast"></div>

  <!-- 升级特效（全屏弹窗+星星动画） -->
  <div id="levelUp">
    <div class="lu-bg"></div>
    <div class="lu-text"></div>
  </div>

  <!-- 回到默认视角按钮（拖拽后出现在右下角） -->
  <div id="recenterBtn">🏠</div>

  <!-- ========== 首次登录流程 ========== -->
  <!-- 欢迎引导页 -->
  <div id="welcome">
    <div class="welcome-card">
      <div class="welcome-title">🏝️ 海岛日记</div>
      <div class="welcome-sub">种菜 · 收菜 · 慢慢长大</div>
      <div class="welcome-tips">
        <div class="welcome-tip"><span class="welcome-tip-icon">👆</span>点击菜地格子种菜</div>
        <div class="welcome-tip"><span class="welcome-tip-icon">💧</span>作物需要浇水才能生长</div>
        <div class="welcome-tip"><span class="welcome-tip-icon">🚤</span>把蔬菜卖给收购船赚星币</div>
        <div class="welcome-tip"><span class="welcome-tip-icon">🖐️</span>拖动屏幕查看更多区域</div>
      </div>
      <button class="welcome-btn" id="welcomeBtn">开始游戏</button>
    </div>
  </div>

  <!-- 角色选择页（首次登录时显示） -->
  <div id="charPicker">
    <div class="char-picker-card">
      <div class="char-picker-title">🎭 选择你的角色</div>
      <div class="char-picker-sub">选择一个喜欢的角色开始海岛生活吧！</div>
      <!-- JS 动态生成角色卡片 -->
      <div class="char-grid" id="charGrid"></div>
      <button class="char-confirm-btn" id="charConfirmBtn">确认选择</button>
    </div>
  </div>
</div>

<!-- ====== JavaScript（按依赖顺序加载） ====== -->
<script src="js/config.js"></script>    <!-- 1. 游戏配置：作物、等级、常量 -->
<script src="js/utils.js"></script>    <!-- 2. 工具函数：缓动、震动、格式化 -->
<script src="js/state.js"></script>    <!-- 3. 状态管理：存档/读档/迁移 -->
<script src="js/renderer.js"></script> <!-- 4. 场景渲染：DOM操作、画面刷新 -->
<script src="js/farm.js"></script>     <!-- 5. 耕种系统：种植/浇水/收获 -->
<script src="js/ui.js"></script>       <!-- 6. UI系统：面板/弹窗/成就/NPC -->
<script src="js/input.js"></script>    <!-- 7. 输入处理：拖拽/点击/行走/菜单 -->
<script src="js/game.js"></script>     <!-- 8. 主控制器：初始化、游戏循环 -->

</body>
</html>
