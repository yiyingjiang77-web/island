<!DOCTYPE html>

<title>果香小岛 Demo2.4 — 可收起背包</title>
<style>
*{box-sizing:border-box}

.stage{position:relative;width:100%;height:100%}
.world-frame{display:block;width:100%;height:100%;border:0;background:#151a27}

/* 通用功能入口：以后任务中心、图鉴等继续向下追加按钮。 */

.growth-card{padding:13px;border:1px solid rgba(255,255,255,.12);border-radius:15px;background:rgba(255,255,255,.055)}.growth-card+.growth-card{margin-top:10px}.growth-level-line{display:flex;align-items:end;justify-content:space-between}.growth-level-line strong{font-size:23px}.growth-level-line span{color:#e7ca72;font-size:11px}.growth-progress{height:9px;margin:10px 0 6px;border-radius:7px;background:rgba(255,255,255,.1);overflow:hidden}.growth-progress span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#75b768,#f0d169)}.growth-exp{display:flex;justify-content:space-between;color:#aebbac;font-size:10px}.growth-max{margin:10px 0 0;color:#f0d169;font-size:12px}.reward-list{display:flex;flex-direction:column;gap:7px}.reward-card{padding:9px;border-radius:11px;background:rgba(0,0,0,.16);color:#aebbac;font-size:11px}.reward-card.claimed{border-left:3px solid #75b768;color:#e5ebdf}.reward-card strong{display:block;margin-bottom:4px}.reward-card p{margin:4px 0 0;color:#d8bd72;font-size:10px;line-height:1.45}
.craft-card{padding:14px;border:1px solid rgba(255,255,255,.13);border-radius:16px;background:rgba(255,255,255,.06)}
.craft-recipe{display:flex;align-items:center;gap:11px}.craft-recipe .emoji{font-size:38px}.craft-recipe h3{margin:0;font-size:17px}.craft-recipe p{margin:4px 0 0;color:#aebbac;font-size:12px}
.craft-material{margin:13px 0;padding:10px;border-radius:12px;background:rgba(0,0,0,.16);font-size:12px;line-height:1.7}.craft-materials{margin:13px 0}.craft-materials .craft-material{margin:4px 0;padding:6px 10px}.craft-materials .craft-material.short{background:rgba(231,76,60,.18)}.craft-materials .craft-material .insufficient{color:#e74c3c;font-weight:600}.craft-materials .craft-material-summary{margin-top:6px;font-size:12px;opacity:.8}
.craft-quantity{display:flex;align-items:center;gap:7px}.craft-quantity button,.craft-submit{border:0;border-radius:10px;background:#527e4c;color:white;padding:9px 12px;cursor:pointer;font-weight:700}
.craft-quantity output{min-width:38px;text-align:center;font-size:18px;font-weight:700}.craft-quantity output.disabled{color:#778079}.craft-quantity .max{margin-left:auto;background:#78633c}

.customer-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.customer-card{border:1px solid rgba(255,255,255,.13);border-radius:13px;background:rgba(255,255,255,.055);color:#fff;padding:10px;text-align:left;cursor:pointer}.customer-card:hover,.customer-card.selected{border-color:#d8f1b8;background:rgba(94,140,76,.28)}.customer-card .customer-line{display:flex;align-items:center;gap:7px}.customer-card .avatar{font-size:24px}.customer-card strong{font-size:13px}.customer-card .order{margin-top:7px;color:#f1d68a;font-size:12px}.customer-card .reward{margin-top:3px;color:#a9c5a4;font-size:10px}.customer-empty{padding:20px;text-align:center;color:#93a096;font-size:12px}
.order-actions{margin:9px 0 13px;padding:10px;border-radius:12px;background:rgba(0,0,0,.17);font-size:12px}.order-actions p{margin:0 0 8px}.order-actions button{width:100%;border:0;border-radius:10px;padding:9px;background:#527e4c;color:#fff;font-weight:700;cursor:pointer}.order-actions button:disabled{opacity:.42;cursor:not-allowed}
.renovation-card{margin-bottom:12px;padding:12px;border:1px solid rgba(130,183,216,.25);border-radius:14px;background:rgba(70,118,148,.1)}.renovation-head{display:flex;align-items:center;justify-content:space-between}.renovation-head strong{font-size:14px}.renovation-head span{color:#80c8ef;font-size:11px}.renovation-copy{margin:7px 0;color:#b8c6c9;font-size:11px;line-height:1.5}.renovation-changes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:9px 0}.renovation-change{padding:7px;border-radius:9px;background:rgba(255,255,255,.06);font-size:10px}.renovation-change strong{display:block;margin-top:2px;color:#e7ca72}.renovation-button{width:100%;border:0;border-radius:10px;padding:9px;background:#527e4c;color:#fff;font-weight:700;cursor:pointer}.renovation-button:disabled{opacity:.42;cursor:not-allowed}.renovation-reason{margin:7px 0 0;color:#ffb29f;font-size:10px}.renovation-message{min-height:16px;margin:8px 0 0;color:#b9d8aa;font-size:11px}.renovation-message.error{color:#ff9d91}
.satisfaction-entry{margin-bottom:12px}.satisfaction-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;border:1px solid rgba(244,211,107,.28);border-radius:13px;background:rgba(244,211,107,.09);color:#fff;padding:10px 12px;cursor:pointer;text-align:left}.satisfaction-toggle small{display:block;margin-top:2px;color:#c5cdbf}.satisfaction-panel{margin-top:8px;padding:12px;border-radius:14px;background:rgba(0,0,0,.18)}.satisfaction-progress{height:8px;margin:9px 0;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}.satisfaction-progress span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#75b768,#f0d169)}.satisfaction-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.satisfaction-stat{padding:7px 4px;border-radius:9px;background:rgba(255,255,255,.06);font-size:10px;text-align:center}.satisfaction-stat strong{display:block;margin-bottom:2px;font-size:14px}.satisfaction-note{margin:9px 0;color:#c8d3c3;font-size:11px;line-height:1.5}.satisfaction-rule-button{border:0;border-radius:8px;background:rgba(255,255,255,.09);color:#e7ca72;padding:6px 8px;cursor:pointer}.satisfaction-rules{margin-top:8px;color:#aebbac;font-size:10px;line-height:1.6}.satisfaction-rule-row{display:flex;justify-content:space-between;padding:3px 0}.satisfaction-history{margin-top:11px}.satisfaction-history h4{margin:0 0 7px;font-size:12px}.satisfaction-history-row{display:grid;grid-template-columns:1fr auto;gap:3px 8px;padding:8px 0;border-top:1px solid rgba(255,255,255,.08);color:#bbc6b7;font-size:10px}.satisfaction-history-row span:nth-child(2){text-align:right}.satisfaction-history-row small{grid-column:1/-1;color:#98a796}.satisfaction-history-row strong{color:#f0d169}.gift-toast{position:absolute;left:50%;top:18px;z-index:90;display:flex;align-items:center;gap:10px;max-width:calc(100vw - 32px);padding:12px 12px 12px 18px;border:1px solid rgba(244,211,107,.5);border-radius:14px;background:rgba(49,65,47,.97);color:#fff;box-shadow:0 10px 34px rgba(0,0,0,.4);transform:translateX(-50%);font-size:13px;text-align:center}.gift-toast button{border:0;background:transparent;color:#d9e3d4;cursor:pointer;font-size:16px}
.bar-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}.bar-slot{border:1px solid rgba(255,255,255,.13);border-radius:12px;background:rgba(255,255,255,.055);color:#fff;padding:10px 5px;cursor:pointer}.bar-slot.selected{border-color:#d8f1b8;background:rgba(94,140,76,.28)}.bar-slot:disabled{cursor:not-allowed;opacity:.7}.bar-slot strong,.bar-slot span{display:block}.bar-slot span{margin-top:3px;color:#a9c5a4;font-size:10px}
.bar-drink{padding:12px;border:1px solid rgba(255,255,255,.13);border-radius:14px;background:rgba(255,255,255,.06);margin-top:9px}.bar-drink-head{display:flex;align-items:center;gap:9px}.bar-drink-head .emoji{font-size:30px}.bar-drink p{margin:7px 0;color:#b8c6b6;font-size:11px;line-height:1.55}.bar-actions{display:flex;gap:8px}.bar-actions button,.recipe-option{flex:1;border:0;border-radius:10px;padding:9px;background:#527e4c;color:#fff;font-weight:700;cursor:pointer}.bar-actions .make{background:#78633c}.recipe-options{display:flex;gap:8px;margin-bottom:10px}.bar-message{min-height:18px;margin:10px 2px 0;color:#b9d8aa;font-size:12px}.bar-message.error{color:#ff9d91}

@media(max-width:600px){
  .feature-rail{right:8px}
  .feature-button{width:51px;height:51px;border-radius:15px}

  .feature-drawer{right:67px;width:calc(100vw - 78px);padding:12px;border-radius:16px}
  .inventory-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>
<main class="stage">
  <!-- Demo2.4 世界层负责地图、移动、种植和经验；外层负责背包等通用功能入口。 -->
  <iframe
    id="world-frame"
    class="world-frame"
    title="果香小岛世界地图"
    src="./demo2.4-world.html">
  </iframe>

  <div class="drawer-shade" id="drawer-shade" onclick="closeFeatureDrawer()"></div>
  <div class="gift-toast" id="gift-toast" role="status" hidden></div>

  <aside class="feature-drawer" id="feature-drawer" aria-hidden="true">
    <header class="drawer-head">
      <div class="drawer-title">
        <h2>🎒 我的背包</h2>
        <p id="inventory-status">收获的原料会自动放入这里</p>
      </div>
      <button class="refresh-button" onclick="loadInventory(true)" title="刷新背包">↻</button>
      <button class="close-button" onclick="closeFeatureDrawer()" title="收起">✕</button>
    </header>
    <div class="summary">
      <span>物品种类</span>
      <strong id="inventory-kind-count">0</strong>
    </div>
    <section class="inventory-grid" id="inventory-grid">
      <div class="loading">正在读取背包…</div>
    </section>
    <p class="inventory-note">背包只用于查看和保存物品，不提供出售农作物功能。</p>
  </aside>

  <aside class="feature-drawer" id="growth-drawer" aria-hidden="true">
    <header class="drawer-head">
      <div class="drawer-title">
        <h2>🌱 小岛成长</h2>
        <p id="growth-status">累计经营经验与逐级固定奖励</p>
      </div>
      <button class="refresh-button" onclick="loadInventory(true)" title="刷新成长进度">↻</button>
      <button class="close-button" onclick="closeFeatureDrawer()" title="收起">✕</button>
    </header>
    <section id="growth-panel"><div class="loading">正在读取成长进度…</div></section>
  </aside>

  <aside class="feature-drawer" id="drink-shop-drawer" aria-hidden="true">
    <header class="drawer-head">
      <div class="drawer-title">
        <h2>🥤 饮品店制作台</h2>
        <p id="craft-status">选择配方和制作数量</p>
      </div>
      <button class="refresh-button" onclick="refreshDrinkShop()" title="刷新制作台">↻</button>
      <button class="close-button" onclick="closeFeatureDrawer()" title="收起">✕</button>
    </header>
    <section id="renovation-panel"><div class="loading">正在读取装修进度…</div></section>
    <section class="satisfaction-entry">
      <button class="satisfaction-toggle" id="satisfaction-toggle"
        onclick="toggleSatisfactionPanel()" aria-expanded="false">
        <span><strong>😊 每日满意度</strong><small id="satisfaction-entry-status">正在读取今日经营表现…</small></span>
        <span>查看 ›</span>
      </button>
      <div class="satisfaction-panel" id="satisfaction-panel" hidden>
        <div class="loading">正在读取满意度…</div>
      </div>
    </section>
    <section class="customer-section">
      <div class="customer-section-head">
        <h3>顾客队列</h3>
        <span class="arrival-countdown" id="arrival-countdown">读取中…</span>
      </div>
      <div class="customer-grid" id="customer-grid">
        <div class="loading">顾客正在到店…</div>
      </div>
      <div id="order-actions"></div>
    </section>
    <section id="crafting-station"><div class="loading">正在读取制作台…</div></section>
    <p class="craft-message" id="craft-message" role="status"></p>
  </aside>

  <aside class="feature-drawer" id="drink-bar-drawer" aria-hidden="true">
    <header class="drawer-head">
      <div class="drawer-title">
        <h2>🍹 室外吧台</h2>
        <p id="drink-bar-status">查看六个吧台并经营饮品</p>
      </div>
      <button class="refresh-button" onclick="loadDrinkBars(true)" title="刷新吧台">↻</button>
      <button class="close-button" onclick="closeFeatureDrawer()" title="收起">✕</button>
    </header>
    <section id="drink-bar-panel"><div class="loading">正在读取吧台…</div></section>
    <p class="bar-message" id="drink-bar-message" role="status"></p>
  </aside>

  <nav class="feature-rail" aria-label="功能入口">
    <button
      class="feature-button"
      id="growth-button"
      onclick="toggleFeatureDrawer('growth')"
      title="查看小岛成长进度">
      <span class="icon">🌱</span>
      <span class="text">成长</span>
    </button>
    <button
      class="feature-button"
      id="inventory-button"
      onclick="toggleFeatureDrawer('inventory')"
      title="展开或收起背包">
      <span class="icon">🎒</span>
      <span class="text">背包</span>
      <span class="feature-badge" id="inventory-badge" style="display:none">0</span>
    </button>
    <button
      class="feature-button"
      id="drink-shop-button"
      onclick="toggleFeatureDrawer('drink-shop')"
      title="打开饮品店制作台">
      <span class="icon">🥤</span>
      <span class="text">制作台</span>
    </button>
    <button
      class="feature-button"
      id="drink-bar-button"
      onclick="toggleFeatureDrawer('drink-bar')"
      title="打开吧台上架">
      <span class="icon">🍹</span>
      <span class="text">吧台</span>
      <span class="feature-badge" id="drink-bar-badge" style="display:none">0</span>
    </button>
  </nav>
</main>

<script>
const AUTH_URL='http://localhost:8081';
const GAME_URL='http://localhost:8082';
const DEV_LOGIN_CODE='dev_demo23_browser';

const ITEM_META={
  strawberry:{name:'草莓',emoji:'🍓'},
  cabbage:{name:'白菜',emoji:'🥬'},
  carrot:{name:'胡萝卜',emoji:'🥕'},
  tomato:{name:'番茄',emoji:'🍅'},
  potato:{name:'土豆',emoji:'🥔'},
  chili:{name:'辣椒',emoji:'🌶️'},
  corn:{name:'玉米',emoji:'🌽'},
  moonberry:{name:'月光莓',emoji:'🫐'},
  strawberry_juice:{name:'草莓汁',emoji:'🥤'},
};

let token='';
let activeFeature=null;
let inventoryLoading=false;
let craftingLoading=false;
let drinkBarLoading=false;
let satisfactionLoading=false;
let satisfactionState=null;
let satisfactionRulesOpen=false;
const notifiedSatisfactionRewards=new Set();
let growthState=null;
let drinkShopProgressLoading=false;
let drinkShopProgress=null;
let selectedRecipe=null;
let craftRecipes=[];
let craftQuantity=1;
let craftOpenUnselected=false;
let orderCraftQuantity=1;
let customerQueue=[];
let nextCustomerArrivalAt=null;
let customerQueueCapacity=5;
let selectedOrderId=null;
let arrivalRefreshPending=false;
let drinkBarState={bars:[],drinks:[]};
let selectedBarId=null;
let requestedBarSlotNumber=null;
let drinkBarLoadedAt=0;
let drinkBarRefreshPending=false;

function toggleFeatureDrawer(feature){
  if(activeFeature===feature){
    closeFeatureDrawer();
    return;
  }
  if(activeFeature) closeFeatureDrawer();
  activeFeature=feature;
  const drawerIds={
    growth:'growth-drawer',
    inventory:'feature-drawer',
    'drink-shop':'drink-shop-drawer',
    'drink-bar':'drink-bar-drawer',
  };
  const drawer=document.getElementById(drawerIds[feature]);
  if(!drawer) return;
  drawer.classList.add('open');
  drawer.setAttribute('aria-hidden','false');
  document.getElementById('drawer-shade').classList.add('show');
  document.getElementById(`${feature}-button`).classList.add('active');
  if(feature==='growth') loadInventory();
  if(feature==='inventory') loadInventory();
  if(feature==='drink-shop'){
    loadCraftingStation();
    loadDrinkShopProgress();
    loadSatisfaction();
  }
  if(feature==='drink-bar') loadDrinkBars();
}

function closeFeatureDrawer(){
  activeFeature=null;
  document.getElementById('feature-drawer').classList.remove('open');
  document.getElementById('feature-drawer').setAttribute('aria-hidden','true');
  document.getElementById('growth-drawer').classList.remove('open');
  document.getElementById('growth-drawer').setAttribute('aria-hidden','true');
  document.getElementById('drink-shop-drawer').classList.remove('open');
  document.getElementById('drink-shop-drawer').setAttribute('aria-hidden','true');
  document.getElementById('drink-bar-drawer').classList.remove('open');
  document.getElementById('drink-bar-drawer').setAttribute('aria-hidden','true');
  document.getElementById('drawer-shade').classList.remove('show');
  document.getElementById('inventory-button').classList.remove('active');
  document.getElementById('growth-button').classList.remove('active');
  document.getElementById('drink-shop-button').classList.remove('active');
  document.getElementById('drink-bar-button').classList.remove('active');
}

async function ensureLogin(){
  if(token) return true;
  try{
    const response=await fetch(`${AUTH_URL}/auth/wechat/login`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code:DEV_LOGIN_CODE}),
    }).then(result=>result.json());
    if(response.code===0&&response.data?.token){
      token=response.data.token;
      return true;
    }
  }catch(error){
    console.warn('[Demo2.4] 登录服务不可用',error);
  }
  return false;
}

async function loadInventory(force=false){
  if(inventoryLoading&&!force) return;
  inventoryLoading=true;
  const grid=document.getElementById('inventory-grid');
  const status=document.getElementById('inventory-status');
  if(grid.children.length===0||force) grid.innerHTML='<div class="loading">正在刷新背包…</div>';

  const loggedIn=await ensureLogin();
  if(!loggedIn){
    renderInventoryError('无法连接登录服务，请确认 8081 已启动');
    inventoryLoading=false;
    return;
  }

  try{
    const response=await fetch(`${GAME_URL}/game/init`,{
      headers:{Authorization:`Bearer ${token}`},
    }).then(result=>result.json());
    if(response.code!==0||!response.data){
      if(response.code===10002) token='';
      throw new Error(response.message||'背包加载失败');
    }
    const cropNames=new Map(
      (response.data.cropConfigs||[]).map(config=>[
        config.cropId,
        {name:config.name,emoji:ITEM_META[config.cropId]?.emoji||'🌿'},
      ]),
    );
    const items=(response.data.inventory||[])
      .filter(item=>(item.count||0)>0)
      .map(item=>({
        ...item,
        meta:ITEM_META[item.itemId]||cropNames.get(item.itemId)||{
          name:item.itemId,
          emoji:'📦',
        },
      }));
    growthState=response.data;
    renderIslandGrowth();
    renderInventory(items);
    showSatisfactionGiftNotifications(response.data.autoSettledSatisfactionRewards||[]);
    status.textContent=`与服务器同步 · ${new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}`;
  }catch(error){
    renderInventoryError(error.message||'背包加载失败');
  }finally{
    inventoryLoading=false;
  }
}

function renderInventoryError(message){

function refreshDrinkShop(){
  return Promise.all([loadCraftingStation(true),loadDrinkShopProgress(true),loadSatisfaction(true)]);
}

function renderIslandGrowth(){
  const panel=document.getElementById('growth-panel');
  const islandGrowth=growthState?.islandGrowth;
  if(!panel||!islandGrowth){
    if(panel) panel.innerHTML='<div class="empty">暂时没有成长数据</div>';
    return;
  }
  const cumulativeExp=Number(islandGrowth.cumulativeExp)||0;
  const currentLevel=Number(islandGrowth.currentLevel)||1;
  const nextThreshold=islandGrowth.nextLevelThreshold==null
    ?null:Number(islandGrowth.nextLevelThreshold);
  const rewards=[...(islandGrowth.rewards||[])].sort((a,b)=>Number(a.level)-Number(b.level));
  const currentFloor=Number(rewards.filter(item=>Number(item.level)<=currentLevel).at(-1)?.cumulativeExp)||0;
  const progress=nextThreshold==null
    ?100:Math.max(0,Math.min(100,Math.round((cumulativeExp-currentFloor)*100/Math.max(1,nextThreshold-currentFloor))));
  const cropNames=new Map((growthState.cropConfigs||[]).map(item=>[item.cropId,item.name]));
  const progressContent=nextThreshold==null
    ?'<p class="growth-max">已达到当前最高等级</p>'
    :`<div class="growth-progress" aria-label="等级进度 ${progress}%"><span style="width:${progress}%"></span></div>
      <div class="growth-exp"><span>累计经验 ${cumulativeExp}</span><span>下一级 ${nextThreshold}</span></div>`;
  panel.innerHTML=`
    <article class="growth-card">
      <div class="growth-level-line"><strong>Lv.${currentLevel}</strong><span>${nextThreshold==null?'最高等级':cumulativeExp+' / '+nextThreshold}</span></div>
      ${progressContent}
    </article>
    <article class="growth-card">
      <div class="customer-section-head"><h3>逐级固定奖励</h3><span class="arrival-countdown">按等级顺序永久获得</span></div>
      <div class="reward-list">${rewards.map(reward=>{
        const cropName=cropNames.get(reward.cropId)||reward.cropId;
        const hints=[reward.materialSourceHint,reward.shopCapabilityHint].filter(Boolean);
        return `<div class="reward-card ${reward.claimed?'claimed':''}">
          <strong>Lv.${reward.level} · ${reward.claimed?'已获得':'待解锁'}</strong>
          <span>🌱 ${escapeHtml(cropName)}种植权 · 📖 ${escapeHtml(reward.recipeId)} 配方</span>
          ${hints.length?`<p>${hints.map(escapeHtml).join(' · ')}</p>`:''}
        </div>`;
      }).join('')}</div>
    </article>`;
  document.getElementById('growth-status').textContent=`累计经验 ${cumulativeExp} · 小岛 ${currentLevel} 级`;
}

async function loadDrinkShopProgress(force=false){
  if(drinkShopProgressLoading&&!force) return;

    }).then(result=>result.json());

    drinkShopProgress=response.data;
    renderDrinkShopProgress();

function renderDrinkShopProgress(){
  const panel=document.getElementById('renovation-panel');
  if(!drinkShopProgress){
    panel.innerHTML='<div class="empty">暂时没有装修数据</div>';
    return;
  }
  const currentConfig=drinkShopProgress.currentConfig||{};
  const nextConfig=drinkShopProgress.nextConfig;
  if(drinkShopProgress.maxLevel||!nextConfig){
    panel.innerHTML=`<article class="renovation-card"><div class="renovation-head">
      <strong>🏠 饮品店 ${drinkShopProgress.currentLevel} 级</strong><span>已满级</span></div>
      <p class="renovation-copy">已达到当前最高装修等级 · 当前金币 🪙${drinkShopProgress.currentGold}</p></article>`;
    return;
  }
  const reasons=[];
  if(!drinkShopProgress.islandLevelMet) reasons.push(`需要小岛达到 ${nextConfig.requiredIslandLevel} 级`);
  if(drinkShopProgress.missingGold>0) reasons.push(`还缺 ${drinkShopProgress.missingGold} 金币`);
  const disabled=reasons.length>0;
  panel.innerHTML=`<article class="renovation-card">
    <div class="renovation-head"><strong>🏠 饮品店 ${drinkShopProgress.currentLevel} 级 → ${nextConfig.level} 级</strong><span>🪙${drinkShopProgress.currentGold}</span></div>
    <p class="renovation-copy">${escapeHtml(nextConfig.improvementText)} · 需要小岛 ${nextConfig.requiredIslandLevel} 级 · 装修 🪙${nextConfig.renovationGold}</p>
    <div class="renovation-changes">
      <div class="renovation-change">队列容量<strong>${currentConfig.queueCapacity} → ${nextConfig.queueCapacity}</strong></div>
      <div class="renovation-change">吧台上限<strong>${currentConfig.barCapacity} → ${nextConfig.barCapacity}</strong></div>
      <div class="renovation-change">销售间隔<strong>${currentConfig.saleIntervalSeconds}s → ${nextConfig.saleIntervalSeconds}s</strong></div>
      <div class="renovation-change">到店间隔<strong>${currentConfig.arrivalIntervalSeconds}s → ${nextConfig.arrivalIntervalSeconds}s</strong></div>
      <div class="renovation-change">冰淇淋能力<strong>${currentConfig.iceCreamEnabled?'已开放':'未开放'} → ${nextConfig.iceCreamEnabled?'已开放':'未开放'}</strong></div>
      <div class="renovation-change">高级配方能力<strong>${currentConfig.advancedRecipeEnabled?'已开放':'未开放'} → ${nextConfig.advancedRecipeEnabled?'已开放':'未开放'}</strong></div>
    </div>
    <button class="renovation-button" onclick="renovateDrinkShop()" ${disabled?'disabled':''}>装修到 ${nextConfig.level} 级</button>
    ${reasons.length?`<p class="renovation-reason">${reasons.map(escapeHtml).join(' · ')}</p>`:''}
    <p class="renovation-message" id="renovation-message" role="status"></p>
  </article>`;
}

async function renovateDrinkShop(){
  const nextConfig=drinkShopProgress?.nextConfig;
  if(!nextConfig||!drinkShopProgress.islandLevelMet||drinkShopProgress.missingGold>0) return;
  if(!confirm(`确认花费 ${nextConfig.renovationGold} 金币，将饮品店装修到 ${nextConfig.level} 级吗？`)) return;
  const message=document.getElementById('renovation-message');
  message.className='renovation-message';
  message.textContent='正在装修…';
  try{
    const response=await fetch(`${GAME_URL}/drink-shop/renovate`,{
      method:'POST',
      headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
      body:JSON.stringify({targetLevel:nextConfig.level}),
    }).then(result=>result.json());
    if(response.code!==0) throw new Error(response.message||'装修失败');
    await Promise.all([loadInventory(true),loadDrinkShopProgress(true),loadCraftingStation(true),loadDrinkBars(true)]);
    const refreshedMessage=document.getElementById('renovation-message');
    if(refreshedMessage) refreshedMessage.textContent=`装修成功，饮品店已升到 ${response.data.currentLevel} 级`;
    notifyWorldPlayerChanged();
  }catch(error){
    message.className='renovation-message error';
    message.textContent=error.message||'装修失败';
  }
}

function toggleSatisfactionPanel(){
  const panel=document.getElementById('satisfaction-panel');
  const expanded=panel.hidden;
  panel.hidden=!expanded;
  document.getElementById('satisfaction-toggle').setAttribute('aria-expanded',String(expanded));
  if(expanded&&!satisfactionState) loadSatisfaction();
}

function toggleSatisfactionRules(){
  satisfactionRulesOpen=!satisfactionRulesOpen;
  renderSatisfaction();
}

function renderSatisfaction(){
  if(!satisfactionState) return;
  const today=satisfactionState.today||{};
  const rules=satisfactionState.giftRules||[];
  const percent=Math.max(0,Math.min(100,Number(today.satisfactionPercent)||0));
  const tier=today.expectedTier||'暂未达到档位';
  const nextTierNote=today.nextTier
    ?`，距离 ${today.nextTier} 还差 ${today.nextTierPercentNeeded} 个百分点`
    :'，已达到最高档位';
  const eligibility=today.quantityNeeded>0
    ?`${today.expectedTier?'当前预计 '+tier+'，':''}再交付 ${today.quantityNeeded} 份可获得礼品资格`
    :today.expectedTier
      ?`当前预计 ${tier} · 明日自动发放 🪙${today.expectedGold}${nextTierNote}`
      :today.nextTier
        ?`距离 ${today.nextTier} 还差 ${today.nextTierPercentNeeded} 个百分点`
        :'当前没有可用的礼品档位';
  document.getElementById('satisfaction-entry-status').textContent=
    `今日 ${percent}% · 已交付 ${today.deliveredQuantity||0} 份 · ${tier}`;
  const history=satisfactionState.recentHistory||[];
  document.getElementById('satisfaction-panel').innerHTML=`
    <strong>今日满意度 ${percent}%</strong>
    <div class="satisfaction-progress" aria-label="今日满意度 ${percent}%"><span style="width:${percent}%"></span></div>
    <div class="satisfaction-stats">
      <div class="satisfaction-stat"><strong>${today.deliveredOrders||0}</strong>成功订单</div>
      <div class="satisfaction-stat"><strong>${today.rejectedOrders||0}</strong>拒绝订单</div>
      <div class="satisfaction-stat"><strong>${today.deliveredQuantity||0}</strong>交付份数</div>
    </div>
    <p class="satisfaction-note">${escapeHtml(eligibility)}</p>
    <button class="satisfaction-rule-button" onclick="toggleSatisfactionRules()">${satisfactionRulesOpen?'收起规则':'规则与礼品档位'}</button>
    ${satisfactionRulesOpen?`<div class="satisfaction-rules">
      满意度 = 成功交付订单 ÷ 当日全部已关闭订单；排队中订单不计入。
      ${rules.length?rules.map(rule=>`<div class="satisfaction-rule-row">
        <span>至少交付 ${rule.minimumDeliveredQuantity} 份 · ${rule.minimumPercent}% · ${escapeHtml(rule.tierCode)}</span>
        <strong>🪙${rule.rewardGold}</strong>
      </div>`).join(''):'<div class="customer-empty">当前没有可用规则</div>'}
    </div>`:''}
    <div class="satisfaction-history"><h4>最近 30 天记录</h4>
      ${history.length?history.map(item=>`<div class="satisfaction-history-row">
        <span>${escapeHtml(item.businessDate)} · 成功 ${item.deliveredOrders} · 拒绝 ${item.rejectedOrders}</span>
        <strong>${item.rewardGold>0?'🪙'+item.rewardGold:'未获礼品'}</strong>
        <small>${item.deliveredQuantity} 份 · ${item.satisfactionPercent}% · ${escapeHtml(item.giftTier||'未达档位')}</small>
      </div>`).join(''):'<div class="customer-empty">还没有已结算的经营记录</div>'}
    </div>`;
}

function showSatisfactionGiftNotifications(rewards){
  const fresh=(rewards||[]).filter(item=>{
    const key=`${item.businessDate}:${item.giftTier}:${item.rewardGold}`;
    if(notifiedSatisfactionRewards.has(key)||Number(item.rewardGold)<=0) return false;
    notifiedSatisfactionRewards.add(key);
    return true;
  });
  if(!fresh.length) return;
  const toast=document.getElementById('gift-toast');
  const total=fresh.reduce((sum,item)=>sum+(Number(item.rewardGold)||0),0);
  toast.innerHTML=`<span>🎁 已自动补发 ${fresh.length} 天满意度礼品，共 🪙${total}</span>
    <button onclick="closeSatisfactionGiftNotification()" aria-label="关闭礼品通知">✕</button>`;
  toast.hidden=false;
}

function closeSatisfactionGiftNotification(){
  document.getElementById('gift-toast').hidden=true;
}

function renderCraftingStation(){
  const station=document.getElementById('crafting-station');
  const recipe=selectedRecipe;
  if(!recipe){
    if(craftRecipes.length===0){
      station.innerHTML='<div class="empty">暂时没有可用配方</div>';
      return;
    }
    station.innerHTML=`<div class="recipe-options">${craftRecipes.map(value=>`
      <button class="recipe-option" onclick="selectCraftRecipe(${htmlJsArgument(value.recipeId)})">
        ${ITEM_META[value.outputItem]?.emoji||'🥤'} ${escapeHtml(value.name)}
      </button>`).join('')}</div><div class="empty">请选择要制作的配方，数量将从 1 开始</div>`;
    return;
  }
  const max=recipe.maxCraftable||0;
  craftQuantity=Math.max(1,Math.min(99,craftQuantity));
  const maximumQuantity=Math.min(99,max);
  const materialsHtml=recipe.materials.map(m=>{
    const req=(m.requiredCount||0)*craftQuantity;
    const have=m.inventoryCount||0;
    const short=have<req;
    return `<div class="craft-material ${short?'short':''}">
      ${escapeHtml(ITEM_META[m.itemId]?.name||m.itemId)} ×${m.requiredCount||0}/份
      <span class="${short?'insufficient':''}">库存 ${have} · 本次消耗 ${req} · 制作后剩余：${Math.max(0,have-req)}${short?' · 不足！':''}</span>
    </div>`;
  }).join('');
  station.innerHTML=`
    <div class="recipe-options">${craftRecipes.map(value=>`
      <button class="recipe-option" onclick="selectCraftRecipe(${htmlJsArgument(value.recipeId)})">
        ${ITEM_META[value.outputItem]?.emoji||'🥤'} ${escapeHtml(value.name)}
      </button>`).join('')}</div>
    <article class="craft-card">
      <div class="craft-recipe">
        <span class="emoji">${ITEM_META[recipe.outputItem]?.emoji||'🥤'}</span>
        <div><h3>${escapeHtml(recipe.name)}</h3><p>每份产出 ${escapeHtml(ITEM_META[recipe.outputItem]?.name||recipe.outputItem)} ×${recipe.outputCount}</p></div>
      </div>
      <div class="craft-materials">${materialsHtml}
        <div class="craft-material-summary">最大可制作：${max}</div>
      </div>
      <div class="craft-quantity" aria-label="制作数量">
        <button onclick="changeCraftQuantity(-1)" ${max<1||craftQuantity<=1?'disabled':''}>−</button>
        <output class="${max<1?'disabled':''}" aria-disabled="${max<1}">${craftQuantity}</output>
        <button onclick="changeCraftQuantity(1)" ${max<1||craftQuantity>=maximumQuantity?'disabled':''}>＋</button>
        <button class="max" onclick="setMaximumCraftQuantity()" ${max<1?'disabled':''}>最大</button>
      </div>
      <button class="craft-submit" onclick="craftSelectedRecipe()" ${max<craftQuantity?'disabled':''}>制作 ${craftQuantity} 份</button>
    </article>`;
}

function selectCraftRecipe(recipeId){
  selectedRecipe=craftRecipes.find(recipe=>recipe.recipeId===recipeId)||null;
  craftQuantity=1;
  renderCraftingStation();
}

async function loadDrinkBars(force=false){
  if(drinkBarLoading&&!force) return;
  drinkBarLoading=true;
  const panel=document.getElementById('drink-bar-panel');
  if(force) panel.innerHTML='<div class="loading">正在刷新吧台…</div>';

    renderDrinkBarError('无法连接登录服务，请确认 8081 已启动');
    drinkBarLoading=false;
    return;
  }
  try{
    const response=await fetch(`${GAME_URL}/drink-shop/bars`,{
      headers:{Authorization:`Bearer ${token}`},
    }).then(result=>result.json());
    if(response.code!==0) throw new Error(response.message||'吧台加载失败');
    drinkBarState=response.data||{bars:[],drinks:[]};
    drinkBarLoadedAt=Date.now();
    const requestedBar=(drinkBarState.bars||[])
      .find(bar=>bar.slotNumber===requestedBarSlotNumber);
    if(requestedBar){
      selectedBarId=requestedBar.barId;
      requestedBarSlotNumber=null;
    }else if(!drinkBarState.bars.some(bar=>bar.barId===selectedBarId)){
      selectedBarId=drinkBarState.bars[0]?.barId||null;
    }
    updateDrinkBarBadge();
    publishDrinkBarsToWorld();
    renderDrinkBars();
    document.getElementById('drink-bar-status').textContent='小屋左三桌、右三桌 · 每桌独立经营';
  }catch(error){
    renderDrinkBarError(error.message||'吧台加载失败');
  }finally{
    drinkBarLoading=false;
  }
}

function renderDrinkBars(){
  const panel=document.getElementById('drink-bar-panel');
  const bars=drinkBarState.bars||[];
  const drinks=drinkBarState.drinks||[];
  const selectedBar=bars.find(bar=>bar.barId===selectedBarId)||null;
  const collectableCount=bars.filter(bar=>bar.state==='SOLD_OUT').length;
  panel.innerHTML=`
    <div class="summary"><span>饮品店 Lv.${drinkBarState.shopLevel||1} · 单桌上限 ${drinkBarState.listingLimit||10} · ${drinkBarState.saleIntervalSeconds||0}秒/份</span><strong>${collectableCount} 桌可收</strong></div>
    ${collectableCount>0
      ?'<div class="bar-actions"><button onclick="collectAllSoldOutBars()">一键收取全部售罄收益</button></div>'
      :''}
    <div class="bar-grid">${bars.map(bar=>`
      <button class="bar-slot ${bar.barId===selectedBarId?'selected':''}"
        onclick="selectDrinkBar(${Number(bar.barId)})">
        <strong>${bar.slotNumber} 号吧台</strong>
        <span>${bar.state==='EMPTY'?'空闲':bar.state==='SOLD_OUT'?'已售罄':'售卖中'}</span>
      </button>`).join('')}</div>
    ${selectedBar===null
      ?'<div class="empty">暂时没有可用吧台</div>'
      :selectedBar.state==='EMPTY'
        ?drinks.map(drink=>renderBarDrink(drink)).join('')
        :renderBarBatch(selectedBar)}`;
}

function renderBarBatch(bar){
  const batch=bar.batch;
  const meta=ITEM_META[batch.itemId]||{name:batch.itemId,emoji:'🥤'};
  const countdown=currentBarCountdown(batch);
  const action=bar.state==='SELLING'
    ?'<button onclick="takeDownSelectedBar()">下架并结算</button>'
    :'<button onclick="collectSelectedBar()">收取本桌收益</button>';
  return `<article class="bar-drink">
    <div class="bar-drink-head"><span class="emoji">${meta.emoji}</span>
      <strong>${bar.slotNumber} 号吧台 · ${escapeHtml(meta.name)}</strong></div>
    <p>剩余：${batch.remainingQuantity} 份 · 已售：${batch.soldQuantity} 份<br>
      待收收益：🪙${batch.pendingGold} · ⭐${batch.pendingExp}<br>
      ${bar.state==='SELLING'?'下一份：'+formatBarCountdown(countdown):'状态：已售罄，等待收取'}</p>
    <div class="bar-actions">${action}</div>
  </article>`;
}

function currentBarCountdown(batch){
  if(batch.nextSaleInSeconds===null||batch.nextSaleInSeconds===undefined) return null;
  const elapsed=Math.floor((Date.now()-drinkBarLoadedAt)/1000);
  return Math.max(0,Number(batch.nextSaleInSeconds)-elapsed);
}

function formatBarCountdown(seconds){
  const safe=Math.max(0,Number(seconds)||0);
  return `${Math.floor(safe/60)}:${String(safe%60).padStart(2,'0')}`;
}

function renderBarDrink(drink){
  const meta=ITEM_META[drink.itemId]||{name:drink.name||drink.itemId,emoji:'🥤'};
  const limit=Number(drinkBarState.listingLimit)||10;
  const directAction=drink.inventoryCount>0
    ?`<label>上架数量 <input id="bar-quantity-${escapeHtml(drink.recipeId)}" type="number" min="1" max="${Math.min(limit,drink.inventoryCount)}" value="${drink.listingQuantity}"></label><button onclick="listSelectedDrink(${htmlJsArgument(drink.recipeId)})">直接上架</button>`
    :'';
  const makeAction=drink.inventoryCount<limit
    ?'<button class="make" onclick="openCraftingStationFromBar()">去制作</button>'
    :'';
  return `<article class="bar-drink">
    <div class="bar-drink-head"><span class="emoji">${meta.emoji}</span>
      <strong>${escapeHtml(drink.name||meta.name)}</strong></div>
    <p>背包成品：${drink.inventoryCount} 份 · 本批上架：${drink.listingQuantity} 份<br>
      单份预计 🪙${drink.unitGold} · ⭐${drink.unitExp}<br>
      整批预计 🪙${drink.expectedBatchGold} · ⭐${drink.expectedBatchExp}</p>
    <div class="bar-actions">${directAction}${makeAction}</div>
  </article>`;
}

function selectDrinkBar(barId){
  if(!drinkBarState.bars.some(bar=>bar.barId===barId)) return;
  selectedBarId=barId;
  renderDrinkBars();
}

async function listSelectedDrink(recipeId){
  const message=document.getElementById('drink-bar-message');
  message.className='bar-message';
  message.textContent='正在上架…';
  try{
    const quantityInput=document.getElementById(`bar-quantity-${recipeId}`);
    const quantity=quantityInput?Number(quantityInput.value):undefined;
    const response=await fetch(`${GAME_URL}/drink-shop/bars/${selectedBarId}/list`,{
      method:'POST',
      headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
      body:JSON.stringify({recipeId,quantity}),
    }).then(result=>result.json());
    if(response.code!==0) throw new Error(response.message||'上架失败');
    message.textContent=`上架成功：${response.data.bar.batch.listedQuantity} 份，预计 🪙${response.data.expectedBatchGold} · ⭐${response.data.expectedBatchExp}`;
    await Promise.all([loadDrinkBars(true),loadInventory(true)]);
  }catch(error){
    message.className='bar-message error';
    message.textContent=error.message||'上架失败';
  }
}

async function takeDownSelectedBar(){
  if(!confirm('确定下架这个吧台的当前批次吗？')) return;
  const message=document.getElementById('drink-bar-message');
  message.className='bar-message';
  message.textContent='正在下架并结算…';
  try{
    const response=await fetch(`${GAME_URL}/drink-shop/bars/${selectedBarId}/take-down`,{
      method:'POST',
      headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
      body:'{}',
    }).then(result=>result.json());
    if(response.code!==0) throw new Error(response.message||'下架失败');
    message.textContent=`下架成功：退回 ${response.data.returnedQuantity} 份，结算 🪙${response.data.settledGold} · ⭐${response.data.settledExp}`;
    await Promise.all([loadDrinkBars(true),loadInventory(true)]);
    document.getElementById('world-frame').contentWindow
      .postMessage({type:'fruit-island:player-changed'},'*');
  }catch(error){
    message.className='bar-message error';
    message.textContent=error.message||'下架失败';
  }
}

async function collectSelectedBar(){
  const message=document.getElementById('drink-bar-message');
  message.className='bar-message';
  message.textContent='正在收取本桌收益…';
  try{
    const response=await fetch(`${GAME_URL}/drink-shop/bars/${selectedBarId}/collect`,{
      method:'POST',
      headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
      body:'{}',
    }).then(result=>result.json());
    if(response.code!==0) throw new Error(response.message||'收取失败');
    message.textContent=`收取成功：🪙${response.data.settledGold} · ⭐${response.data.settledExp}`;

  }catch(error){
    message.className='bar-message error';

  }

async function collectAllSoldOutBars(){
  const collectableCount=(drinkBarState.bars||[])
    .filter(bar=>bar.state==='SOLD_OUT').length;
  if(collectableCount<1) return;
  const message=document.getElementById('drink-bar-message');
  message.className='bar-message';
  message.textContent='正在汇总收取售罄吧台…';

    const response=await fetch(`${GAME_URL}/drink-shop/bars/collect-all`,{
      method:'POST',
      headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
      body:'{}',
    }).then(result=>result.json());
    if(response.code!==0) throw new Error(response.message||'一键收取失败');
    message.textContent=`已收取 ${response.data.collectedBarCount} 个吧台：🪙${response.data.settledGold} · ⭐${response.data.settledExp}`;
    await Promise.all([loadDrinkBars(true),loadInventory(true)]);
    notifyWorldPlayerChanged();
  }catch(error){
    message.className='bar-message error';
    message.textContent=error.message||'一键收取失败';
  }
}

function updateDrinkBarBadge(){
  const collectableCount=(drinkBarState.bars||[])
    .filter(bar=>bar.state==='SOLD_OUT').length;
  const badge=document.getElementById('drink-bar-badge');
  badge.textContent=String(collectableCount);
  badge.style.display=collectableCount>0?'block':'none';
}

function publishDrinkBarsToWorld(){
  const states=(drinkBarState.bars||[]).map(bar=>({
    slotNumber:bar.slotNumber,
    state:bar.state,
  }));
  document.getElementById('world-frame').contentWindow
    .postMessage({type:'fruit-island:drink-bars-state',bars:states},'*');
}

function notifyWorldPlayerChanged(){
  document.getElementById('world-frame').contentWindow
    .postMessage({type:'fruit-island:player-changed'},'*');
}

function openDrinkBarSlot(slotNumber){
  requestedBarSlotNumber=slotNumber;
  const bar=(drinkBarState.bars||[]).find(value=>value.slotNumber===slotNumber);
  if(bar){
    selectedBarId=bar.barId;
    requestedBarSlotNumber=null;
  }
  if(activeFeature!=='drink-bar') toggleFeatureDrawer('drink-bar');
  else if(bar) renderDrinkBars();
  else loadDrinkBars();
}

function openCraftingStationFromBar(){
  closeFeatureDrawer();
  craftOpenUnselected=true;
  selectedRecipe=null;
  craftQuantity=1;
  toggleFeatureDrawer('drink-shop');
}

function renderDrinkBarError(message){
  document.getElementById('drink-bar-status').textContent='吧台暂时不可用';
  document.getElementById('drink-bar-panel').innerHTML=
    `<div class="empty error">${escapeHtml(message)}</div>`;
}

function htmlJsArgument(value){
  return escapeHtml(JSON.stringify(String(value)));
}

function renderCustomerQueue(){
  const grid=document.getElementById('customer-grid');
  if(customerQueue.length===0){
    grid.innerHTML='<div class="customer-empty">暂时没有等待中的顾客</div>';
    document.getElementById('order-actions').innerHTML='';
    updateArrivalCountdown();
    return;
  }
  grid.innerHTML=customerQueue.map(customer=>`
    <button class="customer-card ${customer.orderId===selectedOrderId?'selected':''}"
      onclick="selectCustomerOrder(${Number(customer.orderId)})"
      aria-pressed="${customer.orderId===selectedOrderId}">
      <span class="customer-line">
        <span class="avatar">${escapeHtml(customer.customerAvatar||'🙂')}</span>
        <strong>${escapeHtml(customer.customerName)}</strong>
      </span>
      <span class="order">${escapeHtml(ITEM_META[customer.itemId]?.name||customer.itemId)} ×${customer.quantity}</span>
      <span class="reward">预计 🪙${customer.expectedGold} · ⭐${customer.expectedExp}</span>
    </button>
  `).join('');
  renderOrderActions();
  updateArrivalCountdown();
}

function selectCustomerOrder(orderId){
  selectedOrderId=orderId;
  const customer=customerQueue.find(value=>value.orderId===selectedOrderId);
  orderCraftQuantity=Math.max(1,customer?.quantity||1);
  if(customer?.recipeId){
    const matchingRecipe=craftRecipes.find(r=>r.recipeId===customer.recipeId);
    if(matchingRecipe){
      selectedRecipe=matchingRecipe;
      craftQuantity=1;
    }
  }
  renderCustomerQueue();
  renderCraftingStation();
}

function renderOrderActions(){
  const customer=customerQueue.find(value=>value.orderId===selectedOrderId);
  const actions=document.getElementById('order-actions');
  if(!customer){actions.innerHTML='';return}
  const orderRecipe=craftRecipes.find(r=>r.recipeId===customer.recipeId);
  const excess=Math.max(0,orderCraftQuantity-customer.quantity);
  const hasRecipe=!!orderRecipe;
  let maxCraftable=99;
  if(orderRecipe?.materials){
    maxCraftable=orderRecipe.materials.reduce((limit,m)=>{
      const have=m.inventoryCount||0;
      const per=m.requiredCount||0;
      if(per<=0) return limit;
      return Math.min(limit,Math.floor(have/per));
    },99);
  }
  if(maxCraftable<1) maxCraftable=1;
  let canCraft=true;
  const matsHtml=(orderRecipe?.materials||[]).map(m=>{
    const req=(m.requiredCount||0)*orderCraftQuantity;
    const have=m.inventoryCount||0;
    const short=have<req;
    if(short) canCraft=false;
    return `${escapeHtml(ITEM_META[m.itemId]?.name||m.itemId)} ×${req}${short?' <span style="color:#e74c3c">(不足)</span>':''}`;
  }).join(' · ');
  const plusDisabled=orderCraftQuantity>=99||orderCraftQuantity>=maxCraftable;
  const deliverItem=customer.itemId;
  const deliverHave=(drinkBarState.drinks||[]).find(d=>d.itemId===deliverItem)?.inventoryCount||0;
  const canDeliver=deliverHave>=customer.quantity;
  actions.innerHTML=`<div class="order-actions">
    <p>交付 ${escapeHtml(ITEM_META[customer.itemId]?.name||customer.itemId)} ×${customer.quantity}，获得 🪙${customer.expectedGold} · ⭐${customer.expectedExp}</p>
    <button onclick="deliverSelectedOrder()" ${canDeliver?'':'disabled'}>从背包完整交付 ${canDeliver?'':'(库存 '+deliverHave+')'}</button>
    <p style="margin-top:10px">现场制作 ${orderCraftQuantity} 份 · 消耗 ${matsHtml||'(未知配方)'} · 交付 ${customer.quantity} · 多余入包 ${excess}</p>
    <div class="craft-quantity">
      <button onclick="changeOrderCraftQuantity(-1)" ${orderCraftQuantity<=customer.quantity?'disabled':''}>−</button>
      <output>${orderCraftQuantity}</output>
      <button onclick="changeOrderCraftQuantity(1)" ${plusDisabled?'disabled':''}>＋</button>
    </div>
    <button style="margin-top:8px" onclick="makeAndDeliverSelectedOrder()" ${(hasRecipe&&canCraft)?'':'disabled'}>现场制作并交付</button>
    <button style="margin-top:8px;background:#78633c" onclick="markSelectedOrderOutOfStock()">暂时没货</button>
  </div>`;
}

function changeOrderCraftQuantity(delta){
  const customer=customerQueue.find(value=>value.orderId===selectedOrderId);
  const orderRecipe=craftRecipes.find(r=>r.recipeId===customer?.recipeId);
  let maxCraftable=99;
  if(orderRecipe?.materials){
    maxCraftable=orderRecipe.materials.reduce((limit,m)=>{
      const have=m.inventoryCount||0;
      const per=m.requiredCount||0;
      if(per<=0) return limit;
      return Math.min(limit,Math.floor(have/per));
    },99);
  }
  if(maxCraftable<1) maxCraftable=1;
  orderCraftQuantity=Math.max(
    customer?.quantity||1,
    Math.min(maxCraftable,orderCraftQuantity+delta),
  );
  renderOrderActions();
}

async function deliverSelectedOrder(){
  const message=document.getElementById('craft-message');
  message.className='craft-message';
  message.textContent='正在交付…';
  try{
    const response=await fetch(`${GAME_URL}/drink-shop/orders/${selectedOrderId}/deliver`,{
      method:'POST',headers:{Authorization:`Bearer ${token}`},
    }).then(result=>result.json());
    if(response.code!==0) throw new Error(response.message||'交付失败');
    message.textContent=`交付成功：🪙${response.data.earnedGold} · ⭐${response.data.earnedExp}`;
    await Promise.all([loadCraftingStation(true),loadInventory(true),loadSatisfaction(true)]);
    document.getElementById('world-frame').contentWindow
      .postMessage({type:'fruit-island:player-changed'},'*');
  }catch(error){
    message.className='craft-message error';
    message.textContent=error.message||'交付失败';
  }
}

async function makeAndDeliverSelectedOrder(){
  const message=document.getElementById('craft-message');
  message.className='craft-message';
  message.textContent='正在现场制作并交付…';
  try{
    const response=await fetch(`${GAME_URL}/drink-shop/orders/${selectedOrderId}/make-and-deliver`,{
      method:'POST',
      headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
      body:JSON.stringify({quantity:orderCraftQuantity}),
    }).then(result=>result.json());
    if(response.code!==0) throw new Error(response.message||'制作并交付失败');
    message.textContent=`已制作 ${response.data.craftedQuantity} 份，交付 ${response.data.deliveredQuantity} 份，多余 ${response.data.excessQuantity} 份已入包`;
    await Promise.all([loadCraftingStation(true),loadInventory(true),loadSatisfaction(true)]);
    document.getElementById('world-frame').contentWindow
      .postMessage({type:'fruit-island:player-changed'},'*');
  }catch(error){
    message.className='craft-message error';
    message.textContent=error.message||'制作并交付失败';
  }
}

async function markSelectedOrderOutOfStock(){
  const message=document.getElementById('craft-message');
  message.className='craft-message';
  message.textContent='正在请顾客离开…';
  try{
    const response=await fetch(`${GAME_URL}/drink-shop/orders/${selectedOrderId}/out-of-stock`,{
      method:'POST',headers:{Authorization:`Bearer ${token}`},
    }).then(result=>result.json());
    if(response.code!==0) throw new Error(response.message||'订单关闭失败');
    message.textContent='顾客已因暂时没货离开，本次没有获得奖励';
    await Promise.all([loadCraftingStation(true),loadSatisfaction(true)]);
  }catch(error){
    message.className='craft-message error';
    message.textContent=error.message||'订单关闭失败';
  }
}

function updateArrivalCountdown(){
  const countdown=document.getElementById('arrival-countdown');
  if(!countdown) return;
  if(customerQueue.length>=customerQueueCapacity||!nextCustomerArrivalAt){
    countdown.textContent=customerQueue.length>=customerQueueCapacity?'队列已满 · 计时暂停':'等待到店计时';
    return;
  }
  const remaining=Math.max(0,Math.ceil((new Date(nextCustomerArrivalAt).getTime()-Date.now())/1000));
  const minutes=Math.floor(remaining/60);
  const seconds=String(remaining%60).padStart(2,'0');
  countdown.textContent=`下一位 ${minutes}:${seconds}`;
  if(remaining===0&&!arrivalRefreshPending){
    arrivalRefreshPending=true;
    loadCraftingStation(true).finally(()=>{arrivalRefreshPending=false});
  }
}

function changeCraftQuantity(delta){
  const maximumQuantity=Math.max(1,Math.min(99,selectedRecipe?.maxCraftable||1));
  craftQuantity=Math.max(1,Math.min(maximumQuantity,craftQuantity+delta));
  renderCraftingStation();
}

function setMaximumCraftQuantity(){
  craftQuantity=Math.max(1,Math.min(99,selectedRecipe?.maxCraftable||1));
  renderCraftingStation();
}

async function craftSelectedRecipe(){
  const message=document.getElementById('craft-message');
  message.className='craft-message';
  message.textContent='正在制作…';
  try{
    const response=await fetch(`${GAME_URL}/drink-shop/craft`,{
      method:'POST',
      headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
      body:JSON.stringify({recipeId:selectedRecipe.recipeId,quantity:craftQuantity}),
    }).then(result=>result.json());
    if(response.code!==0) throw new Error(response.message||'制作失败');
    message.textContent=`制作成功：${selectedRecipe.name} ×${response.data.outputCount}`;
    await Promise.all([loadCraftingStation(true),loadInventory(true)]);
  }catch(error){
    message.className='craft-message error';
    message.textContent=error.message||'制作失败';
  }
}

function renderCraftError(message){
  document.getElementById('craft-status').textContent='制作台暂时不可用';
  document.getElementById('crafting-station').innerHTML=`<div class="empty error">${escapeHtml(message)}</div>`;
}

function escapeHtml(value){
  return String(value)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'",'&#039;');
}

window.addEventListener('keydown',event=>{
  if(event.key==='Escape') closeFeatureDrawer();
});

// 世界层收获完成后立即同步背包；只接收当前世界 iframe 的消息。
window.addEventListener('message',event=>{
  const worldFrame=document.getElementById('world-frame');
  if(event.source!==worldFrame.contentWindow) return;
  if(event.data?.type==='fruit-island:inventory-changed') loadInventory(true);
  if(event.data?.type==='fruit-island:open-drink-bar'){
    openDrinkBarSlot(Number(event.data.slotNumber));
  }
  if(event.data?.type==='fruit-island:drink-bars-ready') publishDrinkBarsToWorld();
});

// 抽屉展开期间定期同步，收获后无需重新打开页面。
setInterval(()=>{
  if(activeFeature==='inventory') loadInventory();
},3000);
setInterval(updateArrivalCountdown,1000);
setInterval(()=>{
  if(activeFeature!=='drink-bar'||drinkBarLoading) return;
  const bar=(drinkBarState.bars||[]).find(item=>item.barId===selectedBarId);
  if(bar?.state!=='SELLING') return;
  if(currentBarCountdown(bar.batch)>0){
    renderDrinkBars();
    return;
  }
  if(drinkBarRefreshPending) return;
  drinkBarRefreshPending=true;
  loadDrinkBars(true).finally(()=>{drinkBarRefreshPending=false;});
},1000);

// 页面初次加载时只更新状态与角标，不自动展开或结算吧台。
loadInventory();
loadDrinkBars();
</script>
</body>
